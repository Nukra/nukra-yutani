name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint the installer and helpers
        run: shellcheck --severity=warning ptai-theme src/ptai-gdm-patch
      - name: Lint the rendered shell profile
        # ptai.sh.in is a template; render the tokens to something harmless so
        # shellcheck sees valid shell rather than @TOKEN@ literals
        run: |
          sed -e 's|@[A-Z_0-9]*@|x|g' src/ptai.sh.in > /tmp/ptai.sh
          shellcheck --severity=warning --shell=bash /tmp/ptai.sh
